<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        color: #1c1c26;
        background: #f7f7fb;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f1f1f6; background: #14141c; }
        input, select { background: #1d1d28 !important; color: #f1f1f6 !important; border-color: #2c2c3a !important; }
        .card { background: #1d1d28 !important; border-color: #2c2c3a !important; }
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      p { margin: 4px 0; }
      .muted { color: #767685; font-size: 12px; }
      .error { color: #dc2626; font-size: 12px; }
      label { display: block; font-size: 12px; color: #767685; margin: 8px 0 3px; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border-radius: 6px;
        border: 1px solid #e6e6ee;
        background: #fff;
        font-size: 13px;
      }
      .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
      .row input[type="checkbox"] { width: auto; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px 10px;
        border: none;
        border-radius: 6px;
        background: #4f46e5;
        color: white;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .link {
        background: none;
        color: #4f46e5;
        width: auto;
        padding: 0;
        margin: 8px 0 0;
        font-size: 12px;
        text-decoration: underline;
      }
      .card {
        background: #fff;
        border: 1px solid #e6e6ee;
        border-radius: 8px;
        padding: 10px;
        margin-top: 8px;
      }
      .footer { display: flex; justify-content: space-between; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>FlatCart</h1>
    <div id="app">Loading...</div>
    <script src="popup.js"></script>
  </body>
</html>
